[project]
name = "ideographco-be"
version = "0.1.0"
description = "Backend de IdeoGraphCO: ingesta de noticias políticas colombianas, triangulación y API de lectura"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
